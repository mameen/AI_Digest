[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-digest"
version = "0.4.0"
description = "Deterministic AI news digest pipeline — ingest, enrich, validate, render"
requires-python = ">=3.11"
dependencies = [
    "instructor>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage[toml]>=7.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["lib*", "pipeline*", "agentic*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests", "llm_pipeline/tests", "agentic/hermes/tests"]

[tool.coverage.run]
source = ["lib", "llm_pipeline", "agentic/single_hermes_agent"]
omit = [
    "tests/**",
    "**/test_*.py",
    "**/__pycache__/**",
    "**/vendor/**",
    "scripts/**",
]
branch = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
